name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          path: ./
          extra_args: --debug --only-verified
          version: 3.95.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup Bun
        run: npm install --global bun@1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Security Audit
        run: bun audit

      - name: Migration Consistency
        run: bun run db:migrations:check

      - name: Client Mutation Boundary
        run: bun run architecture:check-client-mutations

      - name: API Route Policies
        run: bun run architecture:check-api-policies
        
      - name: Type Check
        run: bun run type-check
        
      - name: Lint
        run: bun run lint

      - name: Production Console Scan
        run: bun run security:scan-console
        
      - name: Run Tests
        run: bun run test -- --run
        
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
